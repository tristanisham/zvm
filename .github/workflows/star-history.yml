name: Star History

on:
  schedule:
    # Daily. Deliberately off the hour to avoid the top-of-hour API crowd.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: deno task star-history

      - name: Commit if changed
        run: |
          # The SVGs embed no wall-clock timestamp, so they only differ when
          # the star count actually changed. No change means no commit.
          if git diff --quiet -- .github/assets; then
            echo "Star history chart is unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/star-history-light.svg .github/assets/star-history-dark.svg
          git commit -m "chore: update star history chart [skip ci]"
          git push
